name: Build Capacitor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/browser@^6.0.0 --legacy-peer-deps
          npm install @capacitor/status-bar@^6.0.0 @capacitor/app@^6.0.0 --legacy-peer-deps
          npm install @capacitor/share@^6.0.0 --legacy-peer-deps

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bundle Capacitor Bridge
        run: npx esbuild capacitor-src/bridge.js --bundle --outfile=cap-bridge.js --platform=browser

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp cap-bridge.js www/
          cp -r libs www/
          cp -r app-media www/

      - name: Add Android Platform
        run: npx cap add android

      - name: Disable WebView Scrollbar and Lock Text Zoom
        run: |
          python3 - << 'EOF'
          import glob
          path = glob.glob('android/**/MainActivity.java', recursive=True)[0]
          content = open(path).read()

          if 'onCreate' not in content:
              if 'import android.os.Bundle;' not in content:
                  content = content.replace(
                      'import com.getcapacitor.BridgeActivity;',
                      'import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;'
                  )
              insert = '''
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              this.bridge.getWebView().setVerticalScrollBarEnabled(false);
              this.bridge.getWebView().setHorizontalScrollBarEnabled(false);
              this.bridge.getWebView().setOverScrollMode(android.webkit.WebView.OVER_SCROLL_NEVER);
              this.bridge.getWebView().setScrollBarStyle(android.view.View.SCROLLBARS_INSIDE_OVERLAY);
              this.bridge.getWebView().getSettings().setTextZoom(100);
              this.bridge.getWebView().getSettings().setMinimumFontSize(1);
              this.bridge.getWebView().getSettings().setMinimumLogicalFontSize(1);
              this.bridge.getWebView().clearCache(true);
            }
          '''
              idx = content.rfind('}')
              content = content[:idx] + insert + content[idx:]
              open(path, 'w').write(content)
              print("MainActivity.java patched successfully")
          else:
              print("onCreate already exists - manual check needed")
          EOF

      - name: Generate App Icons from resources
        run: npx @capacitor/assets generate --android

      - name: Rebuild launcher icons (bigger badge, safe for round/squircle masks)
        run: |
          pip install pillow --quiet
          python3 scripts/fix_icons.py android/app/src/main/res

      - name: Match native splash to in-app splash (no big-to-small jump)
        run: python3 scripts/native_splash.py android/app/src/main/res

      - name: Copy custom notification icon
        run: |
          mkdir -p android/app/src/main/res
          cp -r notification-icons/drawable-mdpi android/app/src/main/res/
          cp -r notification-icons/drawable-hdpi android/app/src/main/res/
          cp -r notification-icons/drawable-xhdpi android/app/src/main/res/
          cp -r notification-icons/drawable-xxhdpi android/app/src/main/res/
          cp -r notification-icons/drawable-xxxhdpi android/app/src/main/res/

      - name: Patch AndroidManifest for notification permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>' $MANIFEST

      - name: Storage permission for Android 9 and older (Documents export)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>' $MANIFEST
          grep -n "EXTERNAL_STORAGE" $MANIFEST

      - name: Black system navigation bar
        run: |
          python3 - << 'EOF'
          import glob
          paths = glob.glob('android/app/src/main/res/values/styles.xml')
          if not paths:
              print('styles.xml not found - skipped')
          else:
              p = paths[0]
              c = open(p).read()
              item = '<item name="android:navigationBarColor">#000000</item>'
              if 'navigationBarColor' in c:
                  print('navigationBarColor already set')
              else:
                  tag = '<style name="AppTheme.NoActionBar"'
                  i = c.find(tag)
                  j = c.find('>', i) if i != -1 else -1
                  if j == -1:
                      print('AppTheme.NoActionBar not found - skipped')
                  else:
                      c = c[:j+1] + '\n        ' + item + c[j+1:]
                      open(p, 'w').write(c)
                      print('navigation bar set to black')
          EOF

      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Sign with permanent key + bump version (so new APK updates over the old one)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets are missing. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/tracker.keystore
          python3 - << 'EOF'
          import re, os
          path = 'android/app/build.gradle'
          c = open(path).read()

          # 1) Same signing key on every build (this is what lets Android treat
          #    the new APK as an update instead of a different app).
          signing = '\n'.join([
              '    signingConfigs {',
              '        debug {',
              '            storeFile file("tracker.keystore")',
              '            storePassword System.getenv("KEYSTORE_PASSWORD")',
              '            keyAlias "tracker"',
              '            keyPassword System.getenv("KEYSTORE_PASSWORD")',
              '        }',
              '    }',
              ''
          ])
          c, n = re.subn(r'(^android\s*\{[^\n]*\n)', lambda m: m.group(1) + signing, c, count=1, flags=re.M)
          assert n == 1, 'android block not found in build.gradle'

          # 2) versionCode must go up on every build, otherwise Android refuses the update.
          run = os.environ['GITHUB_RUN_NUMBER']
          c, n1 = re.subn(r'versionCode\s+\d+', 'versionCode ' + run, c, count=1)
          c, n2 = re.subn(r'versionName\s+"[^"]*"', 'versionName "1.0.' + run + '"', c, count=1)
          assert n1 == 1 and n2 == 1, 'versionCode/versionName not found'

          open(path, 'w').write(c)
          print('build.gradle patched: versionCode', run)
          EOF

      - name: Build Debug APK with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=1 || \
          (echo "First attempt failed, clearing Gradle cache and retrying..." && \
           rm -rf ~/.gradle/caches && \
           ./gradlew assembleDebug --no-daemon --max-workers=1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Tracker.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Tracker.apk \
            --title "Tracker - latest build" \
            --notes "Auto-built APK from commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
