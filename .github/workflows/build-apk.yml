name: Build Kotlin Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

# Only the newest push builds: several quick uploads no longer run side by side
# (they used to fight over the "latest" release and fail at the publish step).
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets are missing. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/tracker.keystore

      - name: Build Debug APK with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace || \
          (echo "First attempt failed, clearing Gradle cache and retrying..." && \
           rm -rf ~/.gradle/caches && \
           gradle assembleDebug --no-daemon --stacktrace)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Tracker.apk
          # Release notes (for humans).
          printf 'Auto-built APK from commit %s\nversionCode: %s\nversionName: 2.0.%s\n' \
            "${GITHUB_SHA::7}" "$((1000 + GITHUB_RUN_NUMBER))" "$GITHUB_RUN_NUMBER" > release-notes.txt
          # The app's "check for update" button downloads this small file.
          printf '{"versionCode": %s, "versionName": "2.0.%s"}\n' \
            "$((1000 + GITHUB_RUN_NUMBER))" "$GITHUB_RUN_NUMBER" > version.json
          gh release delete latest --yes --cleanup-tag || true
          if ! gh release create latest Tracker.apk version.json \
            --title "Tracker - latest build" \
            --notes-file release-notes.txt \
            --target "$GITHUB_SHA"; then
            # The release already exists (another run created it in between): just replace its files.
            gh release upload latest Tracker.apk version.json --clobber
            gh release edit latest --notes-file release-notes.txt
          fi
